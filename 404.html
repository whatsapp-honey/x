<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Landing Page</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #111;
  font-family: Arial, sans-serif;
}

.page {
  min-height: 100vh;
  min-height: 100svh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  isolation: isolate;
}

.bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: -1;
}

.content {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 20px 12px;
}

.photo {
  width: 76%;
  max-width: 520px;
  aspect-ratio: 1.67;
  object-fit: cover;
  display: block;
}

h1 {
  color: white;
  font-size: 22px;
  font-weight: 400;
  line-height: 1.45;
  margin: 16px 0 0;
}

.continue {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 180px;
  height: 56px;
  margin-top: 16px;
  background: red;
  color: white;
  border-radius: 14px;
  text-decoration: none;
  font-size: 20px;
  font-weight: 400;
}

@media(max-width:480px) {
  .photo { width: 78%; }
  h1 { font-size: 21px; }
}
</style>
</head>

<body>
<main class="page">

<video class="bg" autoplay muted loop playsinline
poster="./background-poster.jpg">
<source src="./background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<section class="content">

<img class="photo"
src="./photo.jpg"
alt="Photo preview">

<h1>
WATCH AND VIEW MY HOT VIDEO<br>
COLLECTION FREE
</h1>

<a class="continue"
href="https://byuxyz8.github.io/mypage/Usbeh7hsRsQ8">
CONTINUE
</a>

</section>
</main>
</body>
  </html>

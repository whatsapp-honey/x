
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Landing Page</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #111;
  font-family: Arial, sans-serif;
}

.page {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  isolation: isolate;
}

.bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.42);
  z-index: -1;
}

.content {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 15px;
}

.photo {
  display: block;
  width: 76%;
  max-width: 520px;
  aspect-ratio: 1.67 / 1;
  object-fit: cover;
}

h1 {
  color: white;
  font-size: 22px;
  font-weight: 400;
  line-height: 1.45;
  margin: 16px 0 0;
}

.free {
  color: white;
  font-size: 24px;
  font-weight: 400;
  margin: 30px 0 0;
}

.continue {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 220px;
  height: 74px;
  margin-top: 66px;
  background: #f00000;
  color: white;
  border-radius: 17px;
  border: 1px solid #222;
  box-shadow: 0 4px 8px #0006;
  text-decoration: none;
  font-size: 25px;
  font-weight: 400;
}

@media (max-width: 480px) {
  h1 { font-size: 21px; }
  .photo { width: 78%; }
}
</style>
</head>

<body>

<main class="page">

  <video class="bg-video"
    autoplay muted loop playsinline
    preload="auto"
    poster="./assets/background-poster.jpg">
    <source src="./assets/background.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <section class="content">

    <!-- FOTO STATIS -->
    <img class="photo"
      src="./assets/poster.jpg"
      alt="Photo preview">

    <h1>
      WATCH AND VIEW MY HOT VIDEO<br>
      COLLECTION
    </h1>

    <p class="free">FREE</p>

    <a class="continue"
      href="https://byuxyz8.github.io/mypage/Usbeh7hsRsQ8">
      CONTINUE
    </a>

  </section>
</main>

</body>
  </html>
